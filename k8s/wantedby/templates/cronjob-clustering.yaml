apiVersion: batch/v1
kind: CronJob
metadata:
  name: pain-clustering
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.clustering.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ .Values.serviceAccount.name }}
          containers:
            - name: clustering
              image: "{{ .Values.classifier.image.repository }}:{{ .Values.classifier.image.tag }}"
              imagePullPolicy: {{ .Values.classifier.image.pullPolicy }}
              command: ["python", "-m", "app.clustering.run"]
              envFrom:
                - secretRef:
                    name: wantedby-classifier-secrets
                - configMapRef:
                    name: wantedby-classifier-config
              resources:
                {{- toYaml .Values.classifier.resources | nindent 16 }}
