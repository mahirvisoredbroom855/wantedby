global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingestor
    static_configs:
      - targets: ["ingestor:8080"]

  - job_name: classifier
    static_configs:
      - targets: ["classifier:8000"]

  - job_name: api
    static_configs:
      - targets: ["api:4000"]
